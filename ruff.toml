target-version = "py312"
line-length = 100
exclude = [".venv", "__pycache__", ".mypy_cache", "output", "sample_data"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PIE", "PT", "T20"]
ignore = ["E501", "T201", "B008"]

[lint.isort]
known-third-party = ["polars", "numpy", "scipy", "plotly", "streamlit", "pyarrow"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
